<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | mdRZNbm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-dark: #1f2833;
            --accent-gold: #c5a059;
            --accent-gold-hover: #d4af37;
            --text-main: #ffffff;
            --text-muted: #c5c6c7;
            --border-color: #2c3846;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-muted);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar-custom {
            background-color: rgba(31, 40, 51, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .navbar-brand {
            color: var(--text-main) !important;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .navbar-brand span.logo-gold {
            color: var(--accent-gold);
        }

        .btn-gold-sm {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            font-weight: 600;
            border-radius: 20px;
            padding: 6px 18px;
            border: none;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-gold-sm:hover {
            background-color: var(--accent-gold-hover);
            color: var(--bg-dark);
        }

        .login-container {
            padding: 60px 0;
            max-width: 450px;
        }

        .login-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent-gold);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-title {
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-control-custom {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px;
        }

        .form-control-custom:focus {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 0.2rem rgba(197, 160, 89, 0.25);
        }

        .form-label-custom {
            color: var(--text-main);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">md<span class="logo-gold">RZN</span>bm</a>
            
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn-gold-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> Home
                </a>
                <a href="{{ url_for('about_me') }}" class="btn-gold-sm">About Me</a>
                <a href="{{ url_for('community_board') }}" class="btn-gold-sm">Community</a>
                
                <a href="{{ url_for('contact_me') }}" class="btn-gold-sm">Contact Me</a>
            </div>
        </div>
    </nav>

    <main class="container login-container">
        <div class="login-card">
            <h2 class="login-title">Log In</h2>

            {% if error %}
                <div class="alert alert-danger py-2" role="alert" style="font-size: 0.9rem;">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label form-label-custom">Username</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-gold-sm w-100 py-2" style="font-size: 1rem;">Log In</button>
            </form>
        </div>
    </main>

</body>
</html>
